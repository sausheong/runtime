# Runtime — turnkey single-node deployment (v1.0 surface).
#
#   make compose-init           # once: generate .env with secrets
#   docker compose build        # build runtimed + embedder + sandbox/browser images
#   docker compose up           # bring up all six pillars
#
# Run from this directory (deploy/compose). Data persists in the `pgdata`
# named volume across `down`; `down -v` resets everything.
#
# SECURITY: runtimed mounts the host Docker socket so it can launch sandbox and
# browser sibling containers. That is root-equivalent on the host — acceptable
# for a single-node trusted self-host; do not expose this compose on untrusted
# infrastructure.
name: runtime

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: runtime
      POSTGRES_PASSWORD: runtime
      POSTGRES_DB: runtime
      POSTGRES_AGENT_PASSWORD: ${RUNTIME_AGENT_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtime"]
      interval: 2s
      timeout: 3s
      retries: 30

  embedder:
    build: ./embedder
    image: runtime-embedder:latest
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 60s

  runtimed:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: runtime:latest
    depends_on:
      postgres:
        condition: service_healthy
      embedder:
        condition: service_healthy
    environment:
      RUNTIME_PG_DSN: postgres://runtime:runtime@postgres:5432/runtime?sslmode=disable
      RUNTIME_AGENT_PG_DSN: postgres://runtime_agent:${RUNTIME_AGENT_DB_PASSWORD}@postgres:5432/runtime?sslmode=disable
      RUNTIME_CTL_ADDR: ":8080"
      RUNTIME_METRICS_ADDR: ":9091"
      RUNTIME_CONFIG: /app/runtime.compose.yaml
      RUNTIME_SESSION_RETENTION: ${RUNTIME_SESSION_RETENTION:-720h}
      RUNTIME_SESSION_RETENTION_BATCH: ${RUNTIME_SESSION_RETENTION_BATCH:-500}
      RUNTIME_SESSION_RETENTION_DRY_RUN: ${RUNTIME_SESSION_RETENTION_DRY_RUN:-0}
      RUNTIME_EVAL_RETENTION: ${RUNTIME_EVAL_RETENTION:-720h}
      RUNTIME_MAX_REQUESTS: ${RUNTIME_MAX_REQUESTS:-512}
      RUNTIME_MAX_STREAMS: ${RUNTIME_MAX_STREAMS:-128}
      RUNTIME_AGENT_MAX_REQUESTS: ${RUNTIME_AGENT_MAX_REQUESTS:-256}
      RUNTIME_AGENT_MAX_STREAMS: ${RUNTIME_AGENT_MAX_STREAMS:-64}
      RUNTIME_MEMORY_RETENTION_DRY_RUN: ${RUNTIME_MEMORY_RETENTION_DRY_RUN:-0}
      RUNTIME_MEMORY_RETENTION_EPISODE: ${RUNTIME_MEMORY_RETENTION_EPISODE:-}
      RUNTIME_MEMORY_RETENTION_FACT: ${RUNTIME_MEMORY_RETENTION_FACT:-}
      RUNTIME_MEMORY_RETENTION_SUMMARY: ${RUNTIME_MEMORY_RETENTION_SUMMARY:-}
      RUNTIME_ADMIN_BOOTSTRAP: ${RUNTIME_ADMIN_BOOTSTRAP}
      # The bootstrap credential is accepted for initial provisioning only.
      # Set to 1 temporarily for a deliberate account-recovery window.
      RUNTIME_ADMIN_BREAK_GLASS: ${RUNTIME_ADMIN_BREAK_GLASS:-0}
      RUNTIME_SECRETS_KEYS: ${RUNTIME_SECRETS_KEYS}
      RUNTIME_SECRETS_PRIMARY: ${RUNTIME_SECRETS_PRIMARY}
      RUNTIME_EMBED_MODEL: ${RUNTIME_EMBED_MODEL:-bge-small-en-v1.5}
      RUNTIME_EMBED_DIM: ${RUNTIME_EMBED_DIM:-384}
      RUNTIME_EMBED_RECALL_FLOOR: ${RUNTIME_EMBED_RECALL_FLOOR:-0.60}
      OPENAI_BASE_URL: http://embedder:8000
      OPENAI_API_KEY: ""
      RUNTIME_SANDBOX_IMAGE: runtime-sandbox:latest
      RUNTIME_BROWSER_IMAGE: runtime-browser:latest
      # Session-scoped isolation (secure-by-default): each agent session's
      # sandbox/browser containers are invisible to other sessions of the same
      # tenant and are torn down at session end. Set to "tenant" to share.
      # (Inherited by the sandboxd/browserd stdio children runtimed spawns.)
      RUNTIME_SANDBOX_SCOPE: session
      RUNTIME_BROWSER_SCOPE: session
      # Stronger container isolation via gVisor. Requires runsc installed on the
      # host and registered with the Docker daemon; leave unset on stock hosts.
      # RUNTIME_SANDBOX_RUNTIME: runsc
      # RUNTIME_BROWSER_RUNTIME: runsc
      # Browser containers join a private internal network shared only with
      # runtimed. CDP is never published on a host interface, and direct
      # non-proxy egress has no route to the internet or data services.
      RUNTIME_BROWSER_NETWORK: runtime_browser-control
      RUNTIME_BROWSER_PROXY_HOST: runtimed
      # The egress proxy must be reachable from the internal browser network,
      # so it binds all interfaces (runtimed's only ones are loopback, the
      # default compose network, and browser-control) and requires a token.
      # 0.0.0.0 is one of the loopback/wildcard literals
      # containerProxyAddrForHost rewrites, so the browser container is handed
      # RUNTIME_BROWSER_PROXY_HOST:3128 — i.e. runtimed:3128 — not 0.0.0.0:3128.
      # Chromium receives the credential over CDP, never in container
      # environment.
      RUNTIME_BROWSER_PROXY_ADDR: 0.0.0.0:3128
      RUNTIME_BROWSER_PROXY_TOKEN: ${RUNTIME_BROWSER_PROXY_TOKEN:?set via make compose-init}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - ./runtime.compose.yaml:/app/runtime.compose.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - browser-control
    # runtimed runs as a non-root uid but must read the mounted docker socket to
    # launch sandbox/browser sibling containers. The socket's group differs by
    # platform: on Docker Desktop the in-container socket is root:root (gid 0);
    # on native Linux it is root:docker (the host docker group's gid). We add
    # BOTH so the common cases work out of the box:
    #   - "0"            covers Docker Desktop (macOS/Windows) — the gid-0 socket
    #   - "${DOCKER_GID:-999}" covers native Linux; set DOCKER_GID in .env to your
    #                    host's docker gid (`getent group docker | cut -d: -f3`;
    #                    999 is the common Debian/Ubuntu default).
    # Membership only grants the socket's group-rw bit; this is within the
    # single-node "docker.sock is root-equivalent" trust posture documented in
    # the operator guide.
    group_add:
      - "0"
      - "${DOCKER_GID:-999}"
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.32.1
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make compose-init}
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      - ../otel/collector-config.yaml:/etc/otel/collector-config.yaml:ro
    expose:
      - "4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.18.0
    command: ["--config=/etc/jaeger/config.yaml"]
    volumes:
      - ../jaeger-config.yaml:/etc/jaeger/config.yaml:ro
      - jaeger-data:/tmp
    ports:
      - "127.0.0.1:16686:16686"

  sandbox:
    profiles: ["build-only"]
    build:
      context: ..
      dockerfile: sandbox.Dockerfile
    image: runtime-sandbox:latest
    command: ["true"]

  browser:
    profiles: ["build-only"]
    build:
      context: ..
      dockerfile: browser.Dockerfile
    image: runtime-browser:latest
    command: ["true"]

volumes:
  pgdata:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  jaeger-data:

networks:
  browser-control:
    name: runtime_browser-control
    internal: true
