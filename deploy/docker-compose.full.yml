# Full stack: Postgres + control plane. Run from the repository root:
#   docker compose -f deploy/docker-compose.full.yml up --build
#
# SECURITY: this baked-in runtime.yaml has no `tokens:`, so the control plane
# runs OPEN (unauthenticated). That's fine for a local demo. Before exposing it
# on a network, add a `tokens:` section to runtime.yaml (see README →
# Authentication) and terminate TLS upstream.
services:
  postgres:
    # Digest-pinned: `pg16` is a major-only tag, so the database minor/patch
    # would otherwise change silently under a deployment the release contract
    # calls reproducible. Refresh the digest as a reviewed dependency update.
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    environment:
      POSTGRES_USER: runtime
      POSTGRES_PASSWORD: runtime
      POSTGRES_DB: runtime
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtime"]
      interval: 2s
      timeout: 3s
      retries: 20
  runtimed:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUNTIME_PG_DSN: postgres://runtime:runtime@postgres:5432/runtime?sslmode=disable
      RUNTIME_CTL_ADDR: ":8080"
      RUNTIME_METRICS_ADDR: ":9091"
      RUNTIME_SESSION_RETENTION: ${RUNTIME_SESSION_RETENTION:-720h}
      RUNTIME_SESSION_RETENTION_BATCH: ${RUNTIME_SESSION_RETENTION_BATCH:-500}
      RUNTIME_SESSION_RETENTION_DRY_RUN: ${RUNTIME_SESSION_RETENTION_DRY_RUN:-0}
      RUNTIME_EVAL_RETENTION: ${RUNTIME_EVAL_RETENTION:-720h}
      RUNTIME_MAX_REQUESTS: ${RUNTIME_MAX_REQUESTS:-512}
      RUNTIME_MAX_STREAMS: ${RUNTIME_MAX_STREAMS:-128}
      RUNTIME_AGENT_MAX_REQUESTS: ${RUNTIME_AGENT_MAX_REQUESTS:-256}
      RUNTIME_AGENT_MAX_STREAMS: ${RUNTIME_AGENT_MAX_STREAMS:-64}
      RUNTIME_MEMORY_RETENTION_DRY_RUN: ${RUNTIME_MEMORY_RETENTION_DRY_RUN:-0}
      RUNTIME_MEMORY_RETENTION_EPISODE: ${RUNTIME_MEMORY_RETENTION_EPISODE:-}
      RUNTIME_MEMORY_RETENTION_FACT: ${RUNTIME_MEMORY_RETENTION_FACT:-}
      RUNTIME_MEMORY_RETENTION_SUMMARY: ${RUNTIME_MEMORY_RETENTION_SUMMARY:-}
    ports:
      - "8080:8080"
