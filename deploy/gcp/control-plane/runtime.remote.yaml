# Control-plane registry for the GCP distributed deployment. Both agents are
# REMOTE: runtimed attaches (health + proxy + status) over the VPC and never
# spawns them. A remote entry sets only id/name/model/tenant/url/auth_token — NOT
# kind/command/workdir/memory/gateway (spawn-time-only; rejected at load).
# Replace the 10.10.0.x hosts with the internal IPs printed by provision.sh.
#
# tenant: agents are scoped to a tenant. With identity ON, the console only shows
# agents in the logged-in admin's tenant, so this MUST match the tenant your
# console users belong to (here: acme, seeded at go-live). Omitting tenant
# defaults to "default", which would hide the agents from an acme admin.
agents:
  - id: nutrition-go
    name: SG Nutrition Investigator (Go)
    model: openai/gpt-5.4          # display only; B's OPENAI_MODEL is authoritative
    tenant: acme
    url: http://10.10.0.AGENT_GO_IP:8080
    auth_token: ${NUTRITION_GO_TOKEN}

  - id: nutrition-openai
    name: SG Nutrition Investigator (OpenAI SDK)
    model: openai/gpt-5.4          # display only; C's OPENAI_MODEL is authoritative
    tenant: acme
    url: http://10.10.0.AGENT_PY_IP:8302
    # The Python contract shim does not enforce a bearer (see deploy_plan.md §7).
    # Port 8302 is VPC-internal only via the firewall. Leave auth_token off so the
    # config does not imply protection the shim doesn't provide. Add it back only
    # after the shim grows a bearer middleware.
