{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "runtime.fullname" . }}
  labels:
    {{- include "runtime.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $dsn := include "runtime.pgDsn" . }}
  {{- if $dsn }}
  RUNTIME_PG_DSN: {{ $dsn | quote }}
  {{- end }}
  {{- if .Values.secrets.agentPgDsn }}
  RUNTIME_AGENT_PG_DSN: {{ .Values.secrets.agentPgDsn | quote }}
  {{- end }}
  {{- if .Values.secrets.secretsKeys }}
  RUNTIME_SECRETS_KEYS: {{ .Values.secrets.secretsKeys | quote }}
  {{- end }}
  {{- if .Values.secrets.secretsPrimary }}
  RUNTIME_SECRETS_PRIMARY: {{ .Values.secrets.secretsPrimary | quote }}
  {{- end }}
  {{- if .Values.secrets.adminBootstrap }}
  RUNTIME_ADMIN_BOOTSTRAP: {{ .Values.secrets.adminBootstrap | quote }}
  {{- end }}
  {{- if .Values.secrets.identitySigningPrivateKey }}
  RUNTIME_IDENTITY_SIGNING_PRIVATE_KEY: {{ .Values.secrets.identitySigningPrivateKey | quote }}
  {{- end }}
  {{- if .Values.secrets.identitySigningPublicKey }}
  RUNTIME_IDENTITY_SIGNING_PUBLIC_KEY: {{ .Values.secrets.identitySigningPublicKey | quote }}
  {{- end }}
  {{- range $id, $token := .Values.secrets.agentAuthTokens }}
  {{ include "runtime.agentAuthKey" (dict "id" $id) }}: {{ $token | quote }}
  {{- end }}
  {{- if .Values.secrets.registrationToken }}
  RUNTIME_REGISTRATION_TOKEN: {{ .Values.secrets.registrationToken | quote }}
  {{- end }}
{{- end }}
