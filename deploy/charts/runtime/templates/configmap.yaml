apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "runtime.fullname" . }}
  labels:
    {{- include "runtime.labels" . | nindent 4 }}
data:
{{- if eq .Values.scheduling.mode "perAgentPods" }}
  # perAgentPods: runtimed runs control-plane-only and ATTACHES to each agent's
  # StatefulSet as a remote replica pool. This runtime.yaml is GENERATED from
  # config.agents — each agent becomes a remote entry whose url is the per-ordinal
  # headless DNS template ({i} expanded by runtimed) and whose replicas is the
  # StatefulSet pod count. The memory opt-in is delivered to the agent POD by its
  # StatefulSet env, not via this file. (Per-agent gateway opt-in is NOT yet wired
  # into the StatefulSet pod env in perAgentPods mode — a known limitation; see the
  # chart README. A remote agent entry must not carry memory/gateway anyway, since
  # config.Validate rejects spawn-time fields on a remote agent.)
  {{- $root := . }}
  runtime.yaml: |
    agents:
    {{- range $a := .Values.config.agents }}
      - id: {{ $a.id }}
        name: {{ $a.name | quote }}
        model: {{ $a.model | quote }}
        tenant: {{ $a.tenant | default "default" | quote }}
        registration_generation: {{ $a.registration_generation | quote }}
        {{- $n := $a.replicas | default 1 | int }}
        {{- $tmpl := include "runtime.agentDialTemplate" (dict "root" $root "id" $a.id) }}
        {{- if gt $n 1 }}
        url: "{{ $tmpl }}"
        replicas: {{ $n }}
        {{- else }}
        url: "{{ $tmpl | replace "{i}" "0" }}"
        {{- end }}
        auth_token: {{ printf "${%s}" (include "runtime.agentAuthKey" (dict "id" $a.id)) | quote }}
    {{- end }}
    {{- with .Values.config.gateway }}
    gateway:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.config.tokens }}
    tokens:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- else }}
  # monolith: runtimed exec-spawns each agent. runtime.requireAgents (called from
  # the Deployment) guarantees a non-empty agents list at render time.
  #
  # config is emitted wholesale, so nothing here validates individual agents.
  # registration_generation is required by config.Validate for EVERY agent, not
  # only perAgentPods ones (whose gate lives in _helpers.tpl). Without this
  # check a monolith release renders cleanly, `helm upgrade` reports success,
  # and the pod then CrashLoops on a config runtimed refuses to load.
  {{- range $a := .Values.config.agents }}
  {{- if not $a.registration_generation }}
  {{- fail (printf "runtime: agent %q requires registration_generation. Keep it stable across ordinary restarts and rotate it when replacing or recreating the agent; runtimed rejects a config without it." $a.id) }}
  {{- end }}
  {{- end }}
  runtime.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
{{- end }}
