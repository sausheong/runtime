name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.12'
          cache: true
      - run: go mod verify
      - run: make check
      - name: Race detector on concurrency-heavy packages
        run: >-
          go test -race
          ./controlplane ./agentruntime ./internal/browser ./internal/gateway
          ./internal/identity ./internal/store ./internal/eval ./internal/memory
          ./internal/httplimit ./cmd/runtimed

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.12'
          cache: true
      - run: make security-scan

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Digest-pinned: `pg16` is a major-only tag, so the PostgreSQL the
        # integration suite runs against would otherwise change minor/patch
        # silently. Keep this digest in step with deploy/compose/docker-compose.yml.
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: runtime
          POSTGRES_PASSWORD: runtime
          POSTGRES_DB: runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.12'
          cache: true
      - name: Enable pgvector
        run: |
          # Match on the digest, not the tag: pulling `repo:tag@digest` leaves the
          # local image untagged, so an `ancestor=pgvector/pgvector:pg16` filter
          # matches nothing and the `test -n` below would fail closed.
          container_id=$(docker ps --filter ancestor=pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb --format '{{.ID}}' | head -1)
          test -n "$container_id"
          docker exec "$container_id" psql -U runtime -d runtime -c 'CREATE EXTENSION IF NOT EXISTS vector'
          docker exec "$container_id" psql -U runtime -d runtime -c \
            "CREATE ROLE runtime_agent_test LOGIN PASSWORD 'runtime-agent-test'"
      - run: make test-integration
        env:
          RUNTIME_PG_DSN: postgres://runtime:runtime@localhost:5432/runtime?sslmode=disable
          RUNTIME_AGENT_PG_DSN: postgres://runtime_agent_test:runtime-agent-test@localhost:5432/runtime?sslmode=disable

  python-shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - run: uv run --project contrib/shims/python --isolated pytest contrib/shims/python/tests

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
      # helm-deps also unpacks the dependency: Helm 4 does not render a
      # dependency left only as charts/postgresql-*.tgz.
      - run: make helm-deps
      - run: make helm-lint
      - run: bash deploy/charts/runtime/test.sh

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.12'
          cache: true
      # error and warning findings block; info and style are advisory for these
      # scripts. Their dominant SC2086 hits are deliberate word splitting: the
      # DSN and AGENTS variables in deploy/charts/runtime/test.sh each hold
      # several --set flags that must split into separate helm arguments, so
      # quoting them as SC2086 advises would break the chart render matrix.
      # The threshold must stay explicit: shellcheck defaults to "style", which
      # exits non-zero on those advisory findings and leaves the gate always red.
      - run: shellcheck --severity=warning deploy/compose/*.sh deploy/compose/initdb/*.sh deploy/gcp/*.sh deploy/gcp/control-plane/*.sh deploy/charts/runtime/*.sh
      - name: Build and smoke-test runtime and tool images
        run: |
          docker build --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" -f deploy/Dockerfile -t runtime:ci .
          test "$(docker image inspect runtime:ci --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "ci"
          test "$(docker image inspect runtime:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker run --rm --entrypoint /app/runtimectl runtime:ci --help
          docker build -f deploy/sandbox.Dockerfile -t runtime-sandbox:ci deploy/
          docker run --rm runtime-sandbox:ci python -c 'import numpy, pandas, matplotlib, requests'
          docker build -f deploy/browser.Dockerfile -t runtime-browser:ci deploy/
          docker run --rm --entrypoint chromium runtime-browser:ci --version
          docker build -f deploy/compose/embedder/Dockerfile -t runtime-embedder:ci deploy/compose/embedder
          docker run --rm --entrypoint python runtime-embedder:ci -c 'import app; assert len(next(app._model.embed(["health"]))) == 384'
      - name: Build GCP agent images from the documented repository-root context
        run: |
          docker build -f deploy/gcp/agent-python/Dockerfile -t nutrition-openai:ci .
          docker build -f deploy/gcp/agent-claude/Dockerfile -t hello-claude:ci .
          docker build -f deploy/gcp/agent-food-label/Dockerfile -t food-label-advisor:ci .
          docker run --rm --entrypoint /app/examples/nutrition-label-openai/.venv/bin/python nutrition-openai:ci -c 'import runtime_contract, fastapi'
          docker run --rm --entrypoint /app/examples/hello-claude/.venv/bin/python hello-claude:ci -c 'import runtime_contract, claude_agent_sdk'
          docker run --rm --entrypoint /app/examples/food-label-advisor/.venv/bin/python food-label-advisor:ci -c 'import runtime_contract, claude_agent_sdk'
      - name: Scan every built image
        run: |
          go install github.com/anchore/grype/cmd/grype@v0.116.0
          grype runtime:ci --fail-on high --only-fixed
          grype runtime-sandbox:ci --fail-on high --only-fixed
          grype runtime-browser:ci --fail-on high --only-fixed
          grype runtime-embedder:ci --fail-on high --only-fixed
          grype nutrition-openai:ci --fail-on high --only-fixed
          grype hello-claude:ci --fail-on high --only-fixed
          grype food-label-advisor:ci --fail-on high --only-fixed
      - name: Generate complete vulnerability reports
        # Diagnostic, never a gate. The preceding "--fail-on high --only-fixed"
        # step is what fails the build; this one runs unfiltered so that no-fix,
        # wont-fix, and unknown-fix findings -- which --only-fixed discards as
        # an ignore filter -- are surfaced in the job log for review.
        # The "|| true" is deliberate: a report must not fail CI.
        run: |
          mkdir -p vuln-reports
          for img in runtime runtime-sandbox runtime-browser runtime-embedder \
                     nutrition-openai hello-claude food-label-advisor; do
            grype "$img:ci" -o json > "vuln-reports/$img-vulnerabilities.json" || true
            echo "::group::$img unfiltered vulnerability summary"
            grype "$img:ci" -o table || true
            echo "::endgroup::"
          done
      - run: docker compose -f deploy/docker-compose.full.yml config --quiet
      - run: docker compose -f deploy/compose/docker-compose.yml config --quiet
        env:
          RUNTIME_ADMIN_BOOTSTRAP: svk-ci.bootstrap
          RUNTIME_SECRETS_KEYS: ci:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RUNTIME_SECRETS_PRIMARY: ci
          RUNTIME_AGENT_DB_PASSWORD: ci-agent-db-password
          GRAFANA_ADMIN_PASSWORD: ci-only-password
      - name: Validate distributed GCP Compose bundles
        run: |
          install /dev/null deploy/gcp/llm.env
          deploy/gcp/control-plane/stage-obs.sh
          docker compose -f deploy/gcp/control-plane/docker-compose.yml config --quiet
          docker compose -f deploy/gcp/agent-go/docker-compose.yml config --quiet
          docker compose -f deploy/gcp/agent-python/docker-compose.yml config --quiet
          docker compose -f deploy/gcp/agent-claude/docker-compose.yml config --quiet
          docker compose -f deploy/gcp/agent-food-label/docker-compose.yml config --quiet
        env:
          RUNTIME_IMAGE: runtime:ci
          NUTRITION_OPENAI_IMAGE: nutrition-openai:ci
          HELLO_CLAUDE_IMAGE: hello-claude:ci
          FOOD_LABEL_IMAGE: food-label-advisor:ci
          RUNTIME_ADMIN_BOOTSTRAP: svk-ci.bootstrap
          RUNTIME_SECRETS_KEYS: ci:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RUNTIME_SECRETS_PRIMARY: ci
          RUNTIME_AGENT_DB_PASSWORD: ci-agent-db-password
          GRAFANA_ADMIN_PASSWORD: ci-only-password
          NUTRITION_GO_TOKEN: ci-go-token
          NUTRITION_GO_GENERATION: 11111111-1111-4111-8111-111111111111
          NUTRITION_OPENAI_TOKEN: ci-python-token
          NUTRITION_OPENAI_GENERATION: 22222222-2222-4222-8222-222222222222
          HELLO_CLAUDE_TOKEN: ci-claude-token
          HELLO_CLAUDE_GENERATION: 33333333-3333-4333-8333-333333333333
          FOOD_LABEL_TOKEN: ci-food-token
          FOOD_LABEL_GENERATION: 44444444-4444-4444-8444-444444444444
          OPENAI_API_KEY: ci-openai-key
          ANTHROPIC_API_KEY: ci-anthropic-key
