name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Digest-pinned: `pg16` is a major-only tag, so the PostgreSQL the
        # release integration suite runs against would otherwise change
        # minor/patch silently under a release the contract calls reproducible.
        # Keep this digest in step with deploy/compose/docker-compose.yml.
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: runtime
          POSTGRES_PASSWORD: runtime
          POSTGRES_DB: runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.12'
          cache: true
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          test "$(sed -n 's/^version: //p' deploy/charts/runtime/Chart.yaml)" = "$version"
          test "$(sed -n 's/^appVersion: \"\\(.*\\)\"/\\1/p' deploy/charts/runtime/Chart.yaml)" = "$version"
      - run: make check
      - name: Scan dependencies and every shipped Go binary
        run: make security-scan
      - name: Enable PostgreSQL integration features
        run: |
          # Match on the digest, not the tag: pulling `repo:tag@digest` leaves the
          # local image untagged, so an `ancestor=pgvector/pgvector:pg16` filter
          # matches nothing and the `test -n` below would fail closed.
          container_id=$(docker ps --filter ancestor=pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb --format '{{.ID}}' | head -1)
          test -n "$container_id"
          docker exec "$container_id" psql -U runtime -d runtime -c 'CREATE EXTENSION IF NOT EXISTS vector'
          docker exec "$container_id" psql -U runtime -d runtime -c \
            "CREATE ROLE runtime_agent_test LOGIN PASSWORD 'runtime-agent-test'"
      - name: Run complete PostgreSQL integration suite
        run: make test-integration
        env:
          RUNTIME_PG_DSN: postgres://runtime:runtime@localhost:5432/runtime?sslmode=disable
          RUNTIME_AGENT_PG_DSN: postgres://runtime_agent_test:runtime-agent-test@localhost:5432/runtime?sslmode=disable
      - name: Run race detector
        run: >-
          go test -race
          ./controlplane ./agentruntime ./internal/browser ./internal/gateway
          ./internal/identity ./internal/store ./internal/eval ./internal/memory
          ./internal/httplimit ./cmd/runtimed
      - name: Run Python shim tests
        run: uv run --project contrib/shims/python --isolated pytest contrib/shims/python/tests
      - name: Run Helm lint and render matrix
        run: |
          make helm-deps
          make helm-lint
          bash deploy/charts/runtime/test.sh
      - name: Validate shell and Compose deployment assets
        run: |
          # error and warning findings block; info and style are advisory for
          # these scripts. Their dominant SC2086 hits are deliberate word
          # splitting: the DSN and AGENTS variables in
          # deploy/charts/runtime/test.sh each hold several --set flags that must
          # split into separate helm arguments, so quoting them as SC2086 advises
          # would break the chart render matrix. The threshold must stay
          # explicit: shellcheck defaults to "style", which exits non-zero on
          # those advisory findings and leaves the gate permanently red.
          shellcheck --severity=warning deploy/compose/*.sh deploy/compose/initdb/*.sh deploy/gcp/*.sh deploy/gcp/control-plane/*.sh deploy/charts/runtime/*.sh
          docker compose -f deploy/docker-compose.full.yml config --quiet
          docker compose -f deploy/compose/docker-compose.yml config --quiet
        env:
          RUNTIME_ADMIN_BOOTSTRAP: svk-release.bootstrap
          RUNTIME_SECRETS_KEYS: release:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RUNTIME_SECRETS_PRIMARY: release
          RUNTIME_AGENT_DB_PASSWORD: release-agent-db-password
          GRAFANA_ADMIN_PASSWORD: release-validation-only
      - name: Validate distributed GCP Compose bundles
        run: |
          install /dev/null deploy/gcp/llm.env
          deploy/gcp/control-plane/stage-obs.sh
          docker compose -f deploy/gcp/control-plane/docker-compose.yml config --quiet
          docker compose -f deploy/gcp/agent-go/docker-compose.yml config --quiet
          docker compose -f deploy/gcp/agent-python/docker-compose.yml config --quiet
          docker compose -f deploy/gcp/agent-claude/docker-compose.yml config --quiet
          docker compose -f deploy/gcp/agent-food-label/docker-compose.yml config --quiet
        env:
          RUNTIME_IMAGE: runtime:release-validation
          NUTRITION_OPENAI_IMAGE: nutrition-openai:release-validation
          HELLO_CLAUDE_IMAGE: hello-claude:release-validation
          FOOD_LABEL_IMAGE: food-label-advisor:release-validation
          RUNTIME_ADMIN_BOOTSTRAP: svk-release.bootstrap
          RUNTIME_SECRETS_KEYS: release:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RUNTIME_SECRETS_PRIMARY: release
          RUNTIME_AGENT_DB_PASSWORD: release-agent-db-password
          GRAFANA_ADMIN_PASSWORD: release-validation-only
          NUTRITION_GO_TOKEN: release-go-token
          NUTRITION_GO_GENERATION: 11111111-1111-4111-8111-111111111111
          NUTRITION_OPENAI_TOKEN: release-python-token
          NUTRITION_OPENAI_GENERATION: 22222222-2222-4222-8222-222222222222
          HELLO_CLAUDE_TOKEN: release-claude-token
          HELLO_CLAUDE_GENERATION: 33333333-3333-4333-8333-333333333333
          FOOD_LABEL_TOKEN: release-food-token
          FOOD_LABEL_GENERATION: 44444444-4444-4444-8444-444444444444
          OPENAI_API_KEY: release-openai-key
          ANTHROPIC_API_KEY: release-anthropic-key
      - name: Build and smoke-test complete repository image inventory
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          docker build --build-arg VERSION="$version" --build-arg REVISION="$GITHUB_SHA" -f deploy/Dockerfile -t runtime:release-validation .
          test "$(docker image inspect runtime:release-validation --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$version"
          test "$(docker image inspect runtime:release-validation --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker run --rm --entrypoint /app/runtimectl runtime:release-validation --help
          docker build -f deploy/sandbox.Dockerfile -t runtime-sandbox:release-validation deploy/
          docker run --rm runtime-sandbox:release-validation python -c 'import numpy, pandas, matplotlib, requests'
          docker build -f deploy/browser.Dockerfile -t runtime-browser:release-validation deploy/
          docker run --rm --entrypoint chromium runtime-browser:release-validation --version
          docker build -f deploy/compose/embedder/Dockerfile -t runtime-embedder:release-validation deploy/compose/embedder
          docker run --rm --entrypoint python runtime-embedder:release-validation -c 'import app; assert len(next(app._model.embed(["health"]))) == 384'
          docker build -f deploy/gcp/agent-python/Dockerfile -t nutrition-openai:release-validation .
          docker build -f deploy/gcp/agent-claude/Dockerfile -t hello-claude:release-validation .
          docker build -f deploy/gcp/agent-food-label/Dockerfile -t food-label-advisor:release-validation .
          docker run --rm --entrypoint /app/examples/nutrition-label-openai/.venv/bin/python nutrition-openai:release-validation -c 'import runtime_contract, fastapi'
          docker run --rm --entrypoint /app/examples/hello-claude/.venv/bin/python hello-claude:release-validation -c 'import runtime_contract, claude_agent_sdk'
          docker run --rm --entrypoint /app/examples/food-label-advisor/.venv/bin/python food-label-advisor:release-validation -c 'import runtime_contract, claude_agent_sdk'
      - name: Install release integrity tools
        run: |
          go install github.com/anchore/syft/cmd/syft@v1.27.0
          go install github.com/anchore/grype/cmd/grype@v0.116.0
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.5.0
      - name: Scan complete image inventory before publication
        run: |
          grype runtime:release-validation --fail-on high --only-fixed
          grype runtime-sandbox:release-validation --fail-on high --only-fixed
          grype runtime-browser:release-validation --fail-on high --only-fixed
          grype runtime-embedder:release-validation --fail-on high --only-fixed
          grype nutrition-openai:release-validation --fail-on high --only-fixed
          grype hello-claude:release-validation --fail-on high --only-fixed
          grype food-label-advisor:release-validation --fail-on high --only-fixed
      - name: Generate complete vulnerability reports
        # Diagnostic, never a gate. The preceding "--fail-on high --only-fixed"
        # step is what blocks publication; this one runs unfiltered so that
        # no-fix, wont-fix, and unknown-fix findings -- which --only-fixed
        # discards as an ignore filter -- are recorded for operator review.
        # The "|| true" is deliberate: a report must not fail the release.
        run: |
          mkdir -p dist
          for img in runtime runtime-sandbox runtime-browser runtime-embedder \
                     nutrition-openai hello-claude food-label-advisor; do
            grype "$img:release-validation" -o json \
              > "dist/$img-vulnerabilities.json" || true
          done
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push immutable image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          version="${RELEASE_TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_TAG#v}"
          docker tag runtime:release-validation "$image"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$version"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker push "$image"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          syft "$digest" -o spdx-json=dist/runtime-image.spdx.json
          syft runtime-sandbox:release-validation -o spdx-json=dist/runtime-sandbox.spdx.json
          syft runtime-browser:release-validation -o spdx-json=dist/runtime-browser.spdx.json
          syft runtime-embedder:release-validation -o spdx-json=dist/runtime-embedder.spdx.json
      - name: Package and push chart
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          make helm-deps
          mkdir -p dist
          helm package deploy/charts/runtime --destination dist
          chart="dist/runtime-${RELEASE_TAG#v}.tgz"
          helm push "$chart" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          syft "$chart" -o spdx-json=dist/runtime-chart.spdx.json
          echo "CHART_PATH=$chart" >> "$GITHUB_ENV"
      - name: Sign and attest image
        run: |
          cosign sign --yes "$IMAGE_DIGEST"
          cosign attest --yes --type spdxjson --predicate dist/runtime-image.spdx.json "$IMAGE_DIGEST"
      - name: Sign chart archive
        run: cosign sign-blob --yes --bundle "dist/runtime-chart.sigstore.json" "$CHART_PATH"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --verify-tag --generate-notes \
            "$CHART_PATH" \
            dist/runtime-image.spdx.json \
            dist/runtime-sandbox.spdx.json \
            dist/runtime-browser.spdx.json \
            dist/runtime-embedder.spdx.json \
            dist/runtime-chart.spdx.json \
            dist/runtime-chart.sigstore.json \
            dist/runtime-vulnerabilities.json \
            dist/runtime-sandbox-vulnerabilities.json \
            dist/runtime-browser-vulnerabilities.json \
            dist/runtime-embedder-vulnerabilities.json \
            dist/nutrition-openai-vulnerabilities.json \
            dist/hello-claude-vulnerabilities.json \
            dist/food-label-advisor-vulnerabilities.json
