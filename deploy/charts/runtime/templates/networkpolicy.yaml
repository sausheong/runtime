{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "runtime.fullname" . }}
  labels:
    {{- include "runtime.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "runtime.selectorLabels" . | nindent 6 }}
      {{- if eq .Values.scheduling.mode "perAgentPods" }}
      # Governs only the control-plane pod. Agent pods have dedicated policies
      # below so arbitrary namespace workloads cannot call them directly.
      app.kubernetes.io/component: control-plane
      {{- end }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              {{- include "runtime.selectorLabels" . | nindent 14 }}
              {{- if eq .Values.scheduling.mode "perAgentPods" }}
              app.kubernetes.io/component: control-plane
              {{- end }}
        {{- with .Values.networkPolicy.metricsIngress }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: 9091
          protocol: TCP
  egress:
    - {}
{{- if eq .Values.scheduling.mode "perAgentPods" }}
{{- $root := . }}
{{- range $a := .Values.config.agents }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "runtime.agentFullname" (dict "root" $root "id" $a.id) }}
  labels:
    {{- include "runtime.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "runtime.selectorLabels" $root | nindent 6 }}
      runtime.agent/id: {{ $a.id | quote }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "runtime.selectorLabels" $root | nindent 14 }}
              app.kubernetes.io/component: control-plane
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - {}
{{- end }}
{{- end }}
{{- end }}
