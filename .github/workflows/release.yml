name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: runtime
          POSTGRES_PASSWORD: runtime
          POSTGRES_DB: runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.1'
          cache: true
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          test "$(sed -n 's/^version: //p' deploy/charts/runtime/Chart.yaml)" = "$version"
          test "$(sed -n 's/^appVersion: \"\\(.*\\)\"/\\1/p' deploy/charts/runtime/Chart.yaml)" = "$version"
      - run: make check
      - name: Enable PostgreSQL integration features
        run: |
          container_id=$(docker ps --filter ancestor=pgvector/pgvector:pg16 --format '{{.ID}}' | head -1)
          test -n "$container_id"
          docker exec "$container_id" psql -U runtime -d runtime -c 'CREATE EXTENSION IF NOT EXISTS vector'
          docker exec "$container_id" psql -U runtime -d runtime -c \
            "CREATE ROLE runtime_agent_test LOGIN PASSWORD 'runtime-agent-test'"
      - name: Run complete PostgreSQL integration suite
        run: make test-integration
        env:
          RUNTIME_PG_DSN: postgres://runtime:runtime@localhost:5432/runtime?sslmode=disable
          RUNTIME_AGENT_PG_DSN: postgres://runtime_agent_test:runtime-agent-test@localhost:5432/runtime?sslmode=disable
      - name: Run race detector
        run: go test -race ./controlplane ./agentruntime ./internal/gateway ./internal/identity ./internal/store ./internal/eval
      - name: Run Python shim tests
        run: uv run --project contrib/shims/python --isolated pytest contrib/shims/python/tests
      - name: Run Helm lint and render matrix
        run: |
          make helm-deps
          bash deploy/charts/runtime/test.sh
      - name: Validate shell and Compose deployment assets
        run: |
          shellcheck deploy/compose/*.sh deploy/compose/initdb/*.sh deploy/gcp/*.sh deploy/gcp/control-plane/*.sh deploy/charts/runtime/*.sh
          docker compose -f deploy/docker-compose.full.yml config --quiet
          docker compose -f deploy/compose/docker-compose.yml config --quiet
        env:
          RUNTIME_ADMIN_BOOTSTRAP: svk-release.bootstrap
          RUNTIME_SECRETS_KEYS: release:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RUNTIME_SECRETS_PRIMARY: release
          RUNTIME_AGENT_DB_PASSWORD: release-agent-db-password
          GRAFANA_ADMIN_PASSWORD: release-validation-only
      - name: Validate distributed GCP Compose bundles
        run: |
          install /dev/null deploy/gcp/llm.env
          deploy/gcp/control-plane/stage-obs.sh
          docker compose -f deploy/gcp/control-plane/docker-compose.yml config --quiet
          docker compose -f deploy/gcp/agent-go/docker-compose.yml config --quiet
          docker compose -f deploy/gcp/agent-python/docker-compose.yml config --quiet
          docker compose -f deploy/gcp/agent-claude/docker-compose.yml config --quiet
          docker compose -f deploy/gcp/agent-food-label/docker-compose.yml config --quiet
        env:
          RUNTIME_IMAGE: runtime:release-validation
          NUTRITION_OPENAI_IMAGE: nutrition-openai:release-validation
          HELLO_CLAUDE_IMAGE: hello-claude:release-validation
          FOOD_LABEL_IMAGE: food-label-advisor:release-validation
          RUNTIME_ADMIN_BOOTSTRAP: svk-release.bootstrap
          RUNTIME_SECRETS_KEYS: release:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          RUNTIME_SECRETS_PRIMARY: release
          RUNTIME_AGENT_DB_PASSWORD: release-agent-db-password
          GRAFANA_ADMIN_PASSWORD: release-validation-only
          NUTRITION_GO_TOKEN: release-go-token
          NUTRITION_OPENAI_TOKEN: release-python-token
          HELLO_CLAUDE_TOKEN: release-claude-token
          FOOD_LABEL_TOKEN: release-food-token
          OPENAI_API_KEY: release-openai-key
          ANTHROPIC_API_KEY: release-anthropic-key
      - name: Install release integrity tools
        run: |
          go install github.com/anchore/syft/cmd/syft@v1.27.0
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.5.0
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push immutable image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_TAG#v}"
          docker build -f deploy/Dockerfile -t "$image" .
          docker push "$image"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          syft "$digest" -o spdx-json=dist/runtime-image.spdx.json
      - name: Package and push chart
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          make helm-deps
          mkdir -p dist
          helm package deploy/charts/runtime --destination dist
          chart="dist/runtime-${RELEASE_TAG#v}.tgz"
          helm push "$chart" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          syft "$chart" -o spdx-json=dist/runtime-chart.spdx.json
          echo "CHART_PATH=$chart" >> "$GITHUB_ENV"
      - name: Sign and attest image
        run: |
          cosign sign --yes "$IMAGE_DIGEST"
          cosign attest --yes --type spdxjson --predicate dist/runtime-image.spdx.json "$IMAGE_DIGEST"
      - name: Sign chart archive
        run: cosign sign-blob --yes --bundle "dist/runtime-chart.sigstore.json" "$CHART_PATH"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --verify-tag --generate-notes \
            "$CHART_PATH" \
            dist/runtime-image.spdx.json \
            dist/runtime-chart.spdx.json \
            dist/runtime-chart.sigstore.json
