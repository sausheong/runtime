# Default values for the runtime chart. Secure-by-default.

image:
  repository: runtime
  tag: ""                 # defaults to .Chart.AppVersion
  digest: ""              # production: sha256:...; overrides tag
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# The supervisor is a single stateful process tree; >1 is unsupported.
replicaCount: 1

# Scheduling topology:
#   monolith     — one pod; runtimed exec-spawns every agent as a child (C2 M1).
#   perAgentPods — one StatefulSet + headless Service per agent (agentd-only
#                  pods); runtimed runs control-plane-only and ATTACHES to them
#                  as remote replica pools (C2 M2). Each agent's pod count comes
#                  from config.agents[].replicas (default 1); agents must NOT set
#                  listen_addr/url in this mode (the chart generates the url).
#
# Registration handshake (C3 M2): in perAgentPods mode, when
# secrets.registrationToken is set (or an existingSecret carrying a
# RUNTIME_REGISTRATION_TOKEN key is used), agent pods perform the registration
# handshake at boot — they fetch their DSN + brokered secrets from the control
# plane's POST /register endpoint instead of reading them from the chart Secret.
# When no registration token is present they read everything from the chart
# Secret (the C2 M2 behavior).
scheduling:
  mode: monolith

# runtime.yaml contents — agent registry + optional gateway config.
# Rendered into a ConfigMap and mounted at /etc/runtime/runtime.yaml.
config:
  agents: []
  # Every perAgentPods agent requires registration_generation: a persisted
  # opaque instance ID (for example a UUID). Keep it stable across ordinary
  # restarts/upgrades and rotate it when replacing or recreating the agent.
  # gateway:
  #   servers: []

# Secrets. For dev set inline; for prod set existingSecret (keys below ignored).
secrets:
  existingSecret: ""
  pgDsn: ""               # RUNTIME_PG_DSN (required unless postgresql.enabled)
  agentPgDsn: ""          # RUNTIME_AGENT_PG_DSN; required for identity/perAgentPods
  secretsKeys: ""         # RUNTIME_SECRETS_KEYS
  secretsPrimary: ""      # RUNTIME_SECRETS_PRIMARY
  adminBootstrap: ""      # RUNTIME_ADMIN_BOOTSTRAP
  identitySigningPrivateKey: "" # Ed25519 private key; control plane only
  identitySigningPublicKey: ""  # matching Ed25519 public key; agents verify
  agentAuthTokens: {}     # per-agent map, e.g. {support: "...", research: "..."}
  registrationToken: ""   # RUNTIME_REGISTRATION_TOKEN — per-agent handshake bearer
                          # (perAgentPods). When set, agent pods pull DSN + brokered
                          # secrets from the control plane at boot instead of from
                          # this Secret. Mint with: runtimectl register mint --agent <id>.
                          # NOTE: with an existingSecret, that secret must carry a
                          # RUNTIME_REGISTRATION_TOKEN key when handshake mode is used.
  # NOTE: legacy bearer tokens are NOT a secret env var — they live in
  # runtime.yaml's `tokens:`. Put them under `config.tokens` (dev only).

identity:
  enabled: false
  subjectForwarding: false  # authenticated caller projection to agents
  breakGlass: false         # temporarily re-enable bootstrap after identity exists
  oidcIssuer: ""          # RUNTIME_OIDC_ISSUER
  oidcClientID: ""        # RUNTIME_OIDC_CLIENT_ID
  oidcRedirectURL: ""     # RUNTIME_OIDC_REDIRECT_URL

# Docker-dependent features (sandbox/browser). OFF by default — a plain pod has
# no Docker daemon. Set dockerHost to enable; see chart README for the DinD recipe.
features:
  dockerHost: ""          # DOCKER_HOST, e.g. tcp://localhost:2375

# Sandbox & browser tool isolation (P3.2).
sandbox:
  scope: session      # session | tenant. session = per-session container isolation + teardown.
  runtime: ""         # container runtime, e.g. "runsc" (gVisor). Requires host install. Empty = engine default.
browser:
  scope: session
  runtime: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []               # [{host: runtime.example.com, paths: [{path: /, pathType: Prefix}]}]
  tls: []

networkPolicy:
  enabled: true
  # Additional NetworkPolicyPeer entries allowed to scrape the private
  # management listener. The default admits only same-namespace Prometheus
  # pods carrying the standard app label. Add a namespaceSelector for a
  # monitoring stack installed in another namespace.
  metricsIngress:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus

obs:
  enabled: false          # ServiceMonitor + Grafana dashboard ConfigMap

# Control-plane lifecycle and HTTP bounds. These render to the documented
# RUNTIME_* environment variables rather than requiring manifest edits.
runtime:
  sessionRetention: 720h
  sessionRetentionBatch: 500
  sessionRetentionDryRun: false
  evalRetention: 720h
  maxRequests: 512
  maxStreams: 128

# Agent HTTP bounds and opt-in live-memory retention. In monolith mode these
# are inherited only by supervised agent children; in perAgentPods they are
# rendered directly into every agent StatefulSet.
agent:
  maxRequests: 256
  maxStreams: 64
  memoryRetention:
    dryRun: false
    episode: ""
    fact: ""
    summary: ""

postgresql:
  enabled: false
  auth:
    username: runtime
    password: runtime
    database: runtime
  # Bitnami migrated their free Docker Hub catalog in late 2025: the versioned
  # `docker.io/bitnami/postgresql:<x>-debian-12-rN` tags now 404 (only `latest` +
  # digests remain there); the pinned tags live under `bitnamilegacy/postgresql`.
  # Point the subchart at the legacy repo so the bundled-PG path actually pulls.
  #
  # Third-party image pinning: charts/postgresql/ is VENDORED upstream content
  # (`make helm-deps` re-fetches it), so its image references are not edited in
  # place -- any edit would be lost on the next `helm dependency update`. The
  # digest below is therefore set as a values override, which the subchart's
  # common.images.image helper honours over `tag`. Refresh it together with the
  # subchart version as a reviewed dependency update.
  #
  # The subchart's two other images (volumePermissions, metrics/postgres-exporter)
  # are upstream-controlled and NOT pinned here because both features are
  # disabled by default, so neither image is ever pulled. Pin them via
  # postgresql.volumePermissions.image.digest / postgresql.metrics.image.digest
  # if you enable those features.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    # bitnamilegacy/postgresql:17.6.0-debian-12-r4 (the subchart's pinned tag)
    digest: sha256:926356130b77d5742d8ce605b258d35db9b62f2f8fd1601f9dbaef0c8a710a8d

# Escape hatches for the DinD opt-in (empty by default).
extraContainers: []
extraVolumes: []
extraVolumeMounts: []

resources: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
