services:
  postgres:
    # Digest-pinned: `pg16` is a major-only tag, so the database minor/patch
    # would otherwise change silently under a deployment the release contract
    # calls reproducible. Refresh the digest as a reviewed dependency update.
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    environment:
      POSTGRES_USER: runtime
      POSTGRES_PASSWORD: runtime
      POSTGRES_DB: runtime
    # No named volume on purpose: this is the throwaway dev/test database that
    # `make pg-up` provisions and the destructive integration suite DROPs tables
    # in. `make pg-down` therefore discards its contents. Use
    # deploy/compose/docker-compose.yml (which has a pgdata volume) for anything
    # you expect to keep.
    volumes:
      - ./compose/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtime"]
      interval: 2s
      timeout: 3s
      retries: 20
