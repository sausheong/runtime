<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Runtime — session</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/ui/static/style.css"></head><body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar">
  <a class="brand" href="/ui"><span class="logo">R</span> Runtime</a>
  <nav>
    <a href="/ui">Agents</a>
    <a href="/ui/observability">Observability</a>
    <a href="/ui/onboarding">Onboarding</a>
    <a href="/ui/select-tenant">Switch tenant</a>
    <form method="post" action="/ui/logout"><button type="submit" class="navbtn">Sign out</button></form>
  </nav>
</header>
<main class="container" id="main">
  <p class="breadcrumb"><a href="/ui">Agents</a> &rsaquo; <a href="/ui/agents/{{.AgentID}}">{{.AgentID}}</a> &rsaquo; session</p>
  <div class="page-head">
    <h1>Session</h1>
    <p class="subtitle mono">{{.SessionID}}</p>
  </div>
  <div class="card">
    <h2>Event stream</h2>
    <p class="card-desc">Live events for this session, replayed from the start.</p>
    <!-- aria-live so a screen-reader user is told the stream connected, stalled,
         or died; the transcript itself is too chatty to announce. -->
    <p class="stream-state" id="stream-state" role="status" aria-live="polite">Connecting to the session stream&hellip;</p>
    <pre id="events" aria-label="Session event transcript" tabindex="0"></pre>
  </div>
</main>
<script>const AGENT="{{.AgentID}}", SID="{{.SessionID}}";</script>
<script src="/ui/static/app.js"></script>
<script>streamSession();</script>
</body></html>
